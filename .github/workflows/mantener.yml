name: Mantener activos los avisos

# GitHub apaga los horarios automáticos de un repo sin cambios en 60 días.
# Esto los vuelve a encender cada mes para que los avisos no se detengan.
on:
  schedule:
    - cron: "17 16 1,15 * *"
  workflow_dispatch:

permissions:
  actions: write

jobs:
  mantener:
    runs-on: ubuntu-latest
    steps:
      - name: Volver a encender los avisos
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api -X PUT "repos/${{ github.repository }}/actions/workflows/avisos.yml/enable"
          gh api -X PUT "repos/${{ github.repository }}/actions/workflows/mantener.yml/enable"
          echo "Avisos activos."
